

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1730">
  <title>Admin Panel | Siam Typing Center</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #0b1730;
      color: white;
      padding: 22px 16px;
    }

    header h1 { margin: 0 0 6px; font-size: 23px; }
    header p { margin: 0; color: #b8c7df; }

    main {
      width: 100%;
      max-width: 1050px;
      margin: 25px auto;
      padding: 0 14px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 22px #1720330c;
    }

    h2 { margin-top: 0; font-size: 20px; }

    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 15px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      background: #087e8b;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled { opacity: 0.6; }

    .secondary { background: #263650; }
    .danger { background: #b42318; }

    .message {
      margin-top: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: #e7f5f6;
      border-radius: 10px;
      padding: 14px 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .search { margin-bottom: 12px; }

    .order {
      border: 1px solid #dce3ed;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .order h3 { margin: 0 0 10px; }
    .order p { line-height: 1.65; margin: 5px 0; }
    .order select { margin-top: 10px; }

    .muted { color: #64748b; font-size: 13px; }

    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr; }
      .card { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Siam Typing Center</h1>
    <p>Professional Admin Dashboard</p>
  </header>

  <main>
    <section id="loginSection" class="card">
      <h2>অ্যাডমিন লগইন</h2>
      <p>আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p>

      <form id="loginForm">
        <label for="email">ইমেইল</label>
        <input
          id="email"
          type="email"
          placeholder="Admin email"
          autocomplete="username"
          required
        >

        <label for="password">পাসওয়ার্ড</label>
        <input
          id="password"
          type="password"
          placeholder="Admin password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">লগইন করুন</button>
      </form>

      <div id="loginMessage" class="message" role="status"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <h2>অ্যাডমিন ড্যাশবোর্ড</h2>
        <p id="adminEmail" class="muted"></p>
        <button id="refreshButton" class="secondary" type="button">
          অর্ডার রিফ্রেশ করুন
        </button>
        <button id="logoutButton" class="danger" type="button">
          লগআউট
        </button>
        <div id="dashboardMessage" class="message" role="status"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="totalCount">0</strong>
          মোট অর্ডার
        </div>
        <div class="stat">
          <strong id="newCount">0</strong>
          নতুন অর্ডার
        </div>
        <div class="stat">
          <strong id="doneCount">0</strong>
          সম্পন্ন অর্ডার
        </div>
      </div>

      <div class="card">
        <h2>কাস্টমারের অর্ডার</h2>
        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="নাম, ফোন বা সার্ভিস দিয়ে খুঁজুন"
        >
        <div id="ordersList">অর্ডার লোড হচ্ছে...</div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      updateDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Siam Typing Center Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDcxUCtetUBVkcrK12RIzDTClPDMfvFK4M",
      authDomain: "siam-typing-center.firebaseapp.com",
      projectId: "siam-typing-center",
      storageBucket: "siam-typing-center.firebasestorage.app",
      messagingSenderId: "830701988283",
      appId: "1:830701988283:web:c2a946beba51d457217c9e",
      measurementId: "G-E0T1TNTC5C"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const loginSection = $("loginSection");
    const dashboard = $("dashboard");
    const loginForm = $("loginForm");
    const loginButton = $("loginButton");
    const loginMessage = $("loginMessage");
    const dashboardMessage = $("dashboardMessage");
    const ordersList = $("ordersList");
    const searchInput = $("searchInput");

    let allOrders = [];

    const statuses = ["নতুন", "কাজ চলছে", "সম্পন্ন", "বাতিল"];

    function showMessage(element, message, isError = false) {
      element.textContent = message;
      element.style.color = isError ? "#b42318" : "#087e8b";
    }

    function firebaseError(error) {
      const messages = {
        "auth/invalid-credential":
          "ইমেইল বা পাসওয়ার্ড সঠিক নয়।",
        "auth/invalid-email":
          "সঠিক ইমেইল লিখুন।",
        "auth/user-not-found":
          "এই ইমেইলে User পাওয়া যায়নি।",
        "auth/wrong-password":
          "পাসওয়ার্ড সঠিক নয়।",
        "auth/too-many-requests":
          "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
        "auth/network-request-failed":
          "ইন্টারনেট সংযোগ পরীক্ষা করুন।",
        "permission-denied":
          "Firestore অনুমতি দেয়নি। নিরাপত্তা নিয়ম পরীক্ষা করতে হবে।"
      };

      return messages[error.code] ||
        ("সমস্যা হয়েছে: " + (error.message || error.code || "অজানা ত্রুটি"));
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginButton.disabled = true;
      showMessage(loginMessage, "লগইন হচ্ছে...");

      try {
        await signInWithEmailAndPassword(
          auth,
          $("email").value.trim(),
          $("password").value
        );

        showMessage(loginMessage, "লগইন সফল!");
      } catch (error) {
        showMessage(loginMessage, firebaseError(error), true);
      } finally {
        loginButton.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginSection.classList.add("hidden");
        dashboard.classList.remove("hidden");
        $("adminEmail").textContent = "লগইন: " + user.email;
        await loadOrders();
      } else {
        dashboard.classList.add("hidden");
        loginSection.classList.remove("hidden");
        allOrders = [];
      }
    });

    async function loadOrders() {
      ordersList.textContent = "অর্ডার লোড হচ্ছে...";
      showMessage(dashboardMessage, "");

      try {
        const snapshot = await getDocs(collection(db, "orders"));

        allOrders = snapshot.docs.map((item) => ({
          id: item.id,
          ...item.data()
        }));

        $("totalCount").textContent = allOrders.length;
        $("newCount").textContent =
          allOrders.filter((o) => (o.status || "নতুন") === "নতুন").length;
        $("doneCount").textContent =
          allOrders.filter((o) => o.status === "সম্পন্ন").length;

        renderOrders();
      } catch (error) {
        ordersList.textContent = "";
        showMessage(
          dashboardMessage,
          firebaseError(error),
          true
        );
      }
    }

    function makeElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    function renderOrders() {
      const term = searchInput.value.trim().toLowerCase();

      const filtered = allOrders.filter((order) => {
        const searchable = [
          order.name,
          order.phone,
          order.service,
          order.details,
          order.status
        ].join(" ").toLowerCase();

        return searchable.includes(term);
      });

      ordersList.replaceChildren();

      if (filtered.length === 0) {
        ordersList.textContent = allOrders.length
          ? "এই অনুসন্ধানে কোনো অর্ডার পাওয়া যায়নি।"
          : "এখনো কোনো অর্ডার পাওয়া যায়নি।";
        return;
      }

      filtered.forEach((order) => {
        const card = document.createElement("article");
        card.className = "order";

        card.appendChild(makeElement("h3", "অর্ডার #" + order.id));

        card.appendChild(makeElement(
          "p", "নাম: " + (order.name || "উল্লেখ নেই")
        ));

        card.appendChild(makeElement(
          "p", "ফোন: " + (order.phone || "উল্লেখ নেই")
        ));

        card.appendChild(makeElement(
          "p", "সার্ভিস: " + (order.service || "উল্লেখ নেই")
        ));

        card.appendChild(makeElement(
          "p", "বিস্তারিত: " + (order.details || "নেই")
        ));

        const statusLabel = makeElement("label", "অর্ডারের স্ট্যাটাস");
        const select = document.createElement("select");
        select.setAttribute("aria-label", "অর্ডারের স্ট্যাটাস");

        const currentStatus = order.status || "নতুন";

        statuses.forEach((status) => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          option.selected = status === currentStatus;
          select.appendChild(option);
        });

        const saveButton = makeElement("button", "স্ট্যাটাস সেভ করুন");
        saveButton.type = "button";

        const statusMessage = makeElement("p", "", "message");

        saveButton.addEventListener("click", async () => {
          saveButton.disabled = true;
          showMessage(statusMessage, "সেভ হচ্ছে...");

          try {
            await updateDoc(doc(db, "orders", order.id), {
              status: select.value
            });

            order.status = select.value;

            $("newCount").textContent =
              allOrders.filter((o) => (o.status || "নতুন") === "নতুন").length;

            $("doneCount").textContent =
              allOrders.filter((o) => o.status === "সম্পন্ন").length;

            showMessage(statusMessage, "স্ট্যাটাস সেভ হয়েছে।");
          } catch (error) {
            showMessage(statusMessage, firebaseError(error), true);
          } finally {
            saveButton.disabled = false;
          }
        });

        card.appendChild(statusLabel);
        card.appendChild(select);
        card.appendChild(saveButton);
        card.appendChild(statusMessage);

        ordersList.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderOrders);

    $("refreshButton").addEventListener("click", loadOrders);

    $("logoutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
        showMessage(loginMessage, "লগআউট হয়েছে।");
      } catch (error) {
        showMessage(dashboardMessage, firebaseError(error), true);
      }
    });
  </script>
</body>
</html>
